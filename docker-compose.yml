services:
  backend:
    build:
      context: ./backend
    container_name: nexora-backend
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - ./backend/.env
    depends_on:
      redis:
        condition: service_healthy

  engine:
    build:
      context: ./engine
    container_name: nexora-engine
    env_file:
      - ./engine/.env
    depends_on:
      redis:
        condition: service_healthy

  ws-server:
    build:
      context: ./ws-server
    container_name: nexora-ws-server
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - ./ws-server/.env
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7
    container_name: nexora-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    volumes:
      - redis-data:/data

volumes:
  redis-data: